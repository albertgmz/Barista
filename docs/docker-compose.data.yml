name: barista-data-tests

services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: barista_test
      MYSQL_USER: barista
      MYSQL_PASSWORD: barista-test-only
      MYSQL_ROOT_PASSWORD: root-test-only
    ports:
      - '33306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ubarista', '-pbarista-test-only']
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  mariadb:
    image: mariadb:11.8.3
    environment:
      MARIADB_DATABASE: barista_test
      MARIADB_USER: barista
      MARIADB_PASSWORD: barista-test-only
      MARIADB_ROOT_PASSWORD: root-test-only
    ports:
      - '33307:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  postgresql:
    image: postgres:17.6
    environment:
      POSTGRES_DB: barista_test
      POSTGRES_USER: barista
      POSTGRES_PASSWORD: barista-test-only
    ports:
      - '35432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barista -d barista_test']
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
