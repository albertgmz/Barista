name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create release tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $baseVersion = node -p "require('./package.json').version"
          $stableTag = "v$baseVersion"
          $exists = git ls-remote --tags origin "refs/tags/$stableTag"
          if ($exists) {
            $tag = "$stableTag-build.$env:GITHUB_RUN_NUMBER"
            $version = "$baseVersion-build.$env:GITHUB_RUN_NUMBER"
          } else {
            $tag = $stableTag
            $version = $baseVersion
          }
          $previous = git tag --merged HEAD --sort=-creatordate | Select-Object -First 1
          $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
          git tag -a $tag -m "Release $version"
          git push origin $tag
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_RANGE=$range" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit licenses
        run: npm run licenses:audit

      - name: Check generated license notices
        run: npm run licenses:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Test
        run: npx vitest run --reporter=default --reporter=junit --outputFile=reports/vitest-junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results-${{ github.run_attempt }}
          path: reports/vitest-junit.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Build installer and portable executable
        run: |
          npm run build
          npx electron-builder --win nsis portable --x64 --publish never

      - name: Generate checksums and release notes
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath release/latest.yml)) {
            throw 'electron-builder did not generate release/latest.yml'
          }
          $files = Get-ChildItem -Path release -File |
            Where-Object {
              $_.Extension -eq '.exe' -or
              $_.Extension -eq '.blockmap' -or
              $_.Name -eq 'latest.yml'
            } |
            Sort-Object Name
          $checksums = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Encoding utf8NoBOM release/SHA256SUMS.txt
          $title = node scripts/release-notes.mjs $env:RELEASE_VERSION release/release-notes.md $env:RELEASE_RANGE
          "RELEASE_TITLE=$title" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $assets = @(
            Get-ChildItem -Path release -File |
              Where-Object {
                $_.Extension -eq '.exe' -or
                $_.Extension -eq '.blockmap' -or
                $_.Name -eq 'latest.yml' -or
                $_.Name -eq 'SHA256SUMS.txt'
              } |
              ForEach-Object FullName
          )
          gh release create $env:RELEASE_TAG $assets `
            --verify-tag `
            --title $env:RELEASE_TITLE `
            --notes-file release/release-notes.md
